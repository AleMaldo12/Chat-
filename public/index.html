<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Seguro Multimedio</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="script.js" defer></script>
</head>
<body>

    <div class="app-container">
        <div class="header">Chat Seguro E2E</div>
        
        <div id="auth-section">
            <input type="text" id="username" placeholder="Tu Nombre">
            <input type="password" id="secret-key" placeholder="Clave secreta compartida">
            <button onclick="entrarChat()">Entrar al Chat</button>
        </div>

        <div id="chat-section" style="display:none;">
            <div id="chat-box"></div>
            
            <div class="input-area">
                <input type="file" id="media-file" style="display: none;" onchange="sendMedia()">
                <button class="media-btn" onclick="document.getElementById('media-file').click()" title="Adjuntar multimedia">📎</button>
                
                <input type="text" id="message" placeholder="Escribe un mensaje...">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

</body>
</html>
